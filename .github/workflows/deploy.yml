name: Deploy to Timeweb

on:
  push:
    branches:
      - main
  schedule:
    # 00:00 Europe/Moscow (UTC+3).
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      actions: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Telegram counters
        timeout-minutes: 5
        continue-on-error: true
        run: npm run update:views

      - name: Build responsive portfolio preview
        run: |
          npm install --no-save --package-lock=false sharp@0.35.5
          node <<'NODE'
          const fs = require('node:fs');
          const sharp = require('sharp');
          (async () => {
            const source = 'img/cases/websites/klimat5ervis-card.jpg';
            const page = 'sozdanie-saitov/index.html';
            const metadata = await sharp(source).metadata();
            const widths = [480, 768, 1280].filter(width => width <= metadata.width);
            const variants = [];
            for (const width of widths) {
              const output = 'img/cases/websites/klimat5ervis-card-' + width + '.webp';
              await sharp(source).resize({ width, withoutEnlargement: true }).webp({ quality: 82 }).toFile(output);
              variants.push('../' + output + ' ' + width + 'w');
              console.log(output + ': ' + fs.statSync(output).size + ' bytes');
            }
            const html = fs.readFileSync(page, 'utf8');
            const pattern = /<img\b[^>]*data-original-src="\.\.\/img\/cases\/websites\/klimat5ervis-card\.jpg"[^>]*>/;
            if (!pattern.test(html)) throw new Error('Klimat-Service portfolio image not found');
            const updated = html.replace(pattern, tag => tag
              .replace(/\ssrc="[^"]*"/, ' src="../img/cases/websites/klimat5ervis-card-768.webp"')
              .replace(/\swidth="[^"]*"/, ' width="' + metadata.width + '"')
              .replace(/\sheight="[^"]*"/, ' height="' + metadata.height + '"')
              .replace(/\s(?:srcset|sizes)="[^"]*"/g, '')
              .replace(/>$/, ' srcset="' + variants.join(', ') + '" sizes="(max-width: 680px) calc(100vw - 28px), (max-width: 900px) calc((100vw - 58px) / 2), (max-width: 1280px) calc((100vw - 76px) / 3), 401px">'));
            fs.writeFileSync(page, updated);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Build and validate pages
        run: |
          npm run build
          npm run check
          npm test

      - name: Save generated pages and counters
        id: counters
        run: |
          git add -- data/articles.json js/article.js sitemap.xml img/cases/websites/klimat5ervis-card-*.webp ':(glob)**/*.html'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh generated pages and counters'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            package.json
            package-lock.json
            BLOG.md
            REKLAMA.md
            scripts/test-tgstat.php
            scripts/test-reklama.cjs
            scripts/**
            tgstat-config.example.php
            **/.env*
            .romanulin-private/**
            **/.romanulin-private/**
            **/tgstat-config.php
            **/tgstat-config.local.php
            **/api/cache/**

      - name: Ensure GitHub Pages build for updated counters
        if: steps.counters.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(git rev-parse HEAD)
          # A Pages run may already exist after the counter commit; avoid cancelling it.
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$current_sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | select(.status != "completed" or .conclusion == "success")] | length')
          if [ "$existing" -gt 0 ]; then
            echo "Pages build already exists for $current_sha; skipping duplicate request."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
