name: Deploy to Timeweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            package.json
            package-lock.json
            BLOG.md
            REKLAMA.md
            scripts/test-tgstat.php
            scripts/test-reklama.cjs
            tgstat-config.example.php
            **/.env*
            .romanulin-private/**
            **/.romanulin-private/**
            **/tgstat-config.php
            **/tgstat-config.local.php
            **/api/cache/**
